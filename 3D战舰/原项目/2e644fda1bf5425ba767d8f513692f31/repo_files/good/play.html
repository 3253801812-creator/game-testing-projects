<!doctype html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#06131f" />
    <title>磁轨铸舰场：3D 战舰</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #e9f8ff;
  background: #020912;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html, body, #root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
button { font: inherit; }
button:focus-visible { outline: 2px solid #67e8f9; outline-offset: 2px; }

.app-shell { position: relative; width: 100%; height: 100%; background: #020912; isolation: isolate; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 44%, transparent 35%, rgba(0,4,10,.5) 100%); z-index: 1; }
.scanlines { position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: .08; background-image: repeating-linear-gradient(to bottom, rgba(157,237,255,.4) 0, rgba(157,237,255,.4) 1px, transparent 1px, transparent 4px); }

.glass-panel { background: linear-gradient(145deg, rgba(7,26,40,.88), rgba(4,17,29,.72)); border: 1px solid rgba(120,218,255,.16); box-shadow: 0 18px 48px rgba(0,0,0,.34), inset 0 1px rgba(255,255,255,.035); backdrop-filter: blur(15px); }
.topbar { position: absolute; z-index: 6; top: 20px; left: 24px; right: 24px; display: flex; align-items: center; gap: 18px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand-block { flex: 1; }
.eyebrow, .panel-kicker { font-size: 10px; letter-spacing: .24em; font-weight: 800; color: #60cce9; text-transform: uppercase; }
h1 { margin: 4px 0 0; font-size: clamp(20px, 2.2vw, 31px); letter-spacing: .02em; font-weight: 760; text-shadow: 0 5px 30px rgba(0,0,0,.5); }
.turn-card { min-width: 148px; padding: 9px 14px; border-left: 1px solid rgba(120,218,255,.25); background: rgba(4,17,29,.45); }
.turn-card span { display:block; font-size:10px; color:#7896a6; letter-spacing:.12em; }
.turn-card strong { display:block; margin-top:2px; color:#dff9ff; font-size:14px; }

.button { border: 1px solid rgba(126,221,255,.24); border-radius: 8px; padding: 10px 14px; cursor: pointer; transition: .18s ease; color: #dff9ff; background: rgba(10,41,58,.78); font-weight: 700; font-size: 12px; letter-spacing:.03em; }
.button:hover:not(:disabled) { transform: translateY(-1px); border-color: rgba(126,221,255,.55); background: rgba(14,61,82,.9); }
.button:disabled { cursor: not-allowed; opacity: .38; }
.button.primary { color:#021016; background: linear-gradient(135deg,#61e4ff,#35c9bc); border-color: transparent; box-shadow: 0 8px 26px rgba(71,218,225,.18); }
.button.secondary { flex: 1; }
.button.ghost { background:rgba(3,18,30,.6); }
.button.full { width:100%; margin-top:10px; padding:12px 14px; }

.left-panel { position:absolute; z-index:5; left:24px; top:112px; width:260px; border-radius:12px; padding:17px; }
.status-message { margin-top:8px; min-height:46px; font-size:13px; line-height:1.55; color:#d5edf6; }
.last-action { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:9px 10px; border-radius:8px; background:rgba(0,0,0,.18); color:#9fb9c6; font-size:12px; }
.result-badge { font-size:10px; padding:3px 6px; border-radius:999px; font-weight:800; }
.result-badge.hit, .result-badge.sunk { color:#ffc0c0; background:rgba(255,72,72,.16); }
.result-badge.miss { color:#d9f4ff; background:rgba(214,245,255,.12); }
.mini-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:12px; }
.mini-stats div { padding:9px 7px; background:rgba(3,13,22,.5); border-radius:8px; }
.mini-stats span { display:block; font-size:9px; color:#6d8c9a; }
.mini-stats b { display:block; margin-top:2px; font-size:16px; }
.api-box { margin-top:12px; display:flex; gap:9px; align-items:flex-start; border-top:1px solid rgba(120,218,255,.10); padding-top:12px; }
.api-dot { width:8px; height:8px; border-radius:50%; margin-top:4px; background:#f3a54a; box-shadow:0 0 10px rgba(243,165,74,.35); }
.api-dot.live { background:#55e0ac; box-shadow:0 0 10px rgba(85,224,172,.45); }
.api-box small { font-size:9px; letter-spacing:.16em; color:#7293a2; }
.api-box p { margin:2px 0 0; font-size:10px; line-height:1.35; color:#a7c1cd; }

.placement-panel { position:absolute; z-index:5; right:24px; top:112px; width:300px; border-radius:12px; padding:17px; transition:.25s ease; }
.placement-panel.collapsed { opacity:0; transform:translateX(16px); pointer-events:none; }
.panel-heading { display:flex; justify-content:space-between; align-items:flex-start; }
.panel-heading h2 { margin:4px 0 0; font-size:18px; }
.orientation { border:1px solid rgba(101,225,241,.3); background:rgba(48,184,199,.08); padding:5px 8px; border-radius:6px; font-size:10px; color:#78e9f4; }
.ship-list { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
.ship-item { display:grid; grid-template-columns:72px 1fr 52px; align-items:center; gap:7px; width:100%; padding:9px; border-radius:8px; border:1px solid rgba(120,218,255,.09); background:rgba(3,15,25,.5); color:#bfd6df; text-align:left; cursor:pointer; transition:.15s ease; }
.ship-item:hover { border-color:rgba(120,218,255,.3); }
.ship-item.active { border-color:#49d6e9; background:rgba(35,148,164,.13); }
.ship-item.placed { color:#8db6b5; }
.ship-name { font-size:11px; font-weight:750; }
.ship-state { font-size:9px; color:#6f909e; text-align:right; }
.ship-units { display:flex; gap:2px; }
.ship-units i { height:5px; flex:1; min-width:5px; background:#63cfe1; border-radius:1px; opacity:.75; }
.ship-item.placed .ship-units i { background:#51c89b; }
.placement-help { margin-top:11px; padding:9px 10px; border-radius:8px; background:rgba(1,10,18,.42); }
.placement-help p { margin:2px 0; font-size:10px; line-height:1.45; color:#7f9eaa; }
.placement-help .invalid { color:#ff8a8a; }
.action-row { display:flex; gap:8px; margin-top:10px; }

.board-label { position:absolute; z-index:4; top:50%; transform:translate(-50%,-50%) rotate(-90deg); font-size:9px; letter-spacing:.24em; color:rgba(158,231,246,.55); pointer-events:none; }
.player-label { left:31.5%; }
.enemy-label { left:68.5%; }
.bottom-hint { position:absolute; z-index:5; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:7px; color:#6d8d9b; font-size:10px; white-space:nowrap; }
kbd { color:#b8d7e3; background:rgba(5,24,36,.78); border:1px solid rgba(130,220,255,.16); border-bottom-width:2px; border-radius:5px; padding:3px 6px; font:inherit; }

.modal-layer { position:absolute; inset:0; z-index:20; display:grid; place-items:center; background:rgba(0,8,14,.12); opacity:0; pointer-events:none; transition:.25s ease; backdrop-filter:blur(0); }
.modal-layer.show { opacity:1; pointer-events:auto; background:rgba(0,8,14,.66); backdrop-filter:blur(8px); }
.modal-card { position:relative; width:min(390px,calc(100vw - 36px)); overflow:hidden; border:1px solid rgba(109,225,239,.22); border-radius:16px; padding:28px; background:linear-gradient(160deg,rgba(8,31,44,.98),rgba(3,13,23,.98)); box-shadow:0 24px 90px rgba(0,0,0,.5); }
.modal-card h2 { margin:8px 0 5px; font-size:34px; }
.modal-card p { margin:0 0 18px; color:#91adba; font-size:13px; }
.report-row { display:flex; justify-content:space-between; padding:12px 0; border-top:1px solid rgba(121,218,255,.10); border-bottom:1px solid rgba(121,218,255,.10); font-size:12px; color:#8aa7b3; }
.report-row b { color:#dff9ff; }
.victory-ring { position:absolute; width:130px; height:130px; border:1px solid rgba(91,224,239,.12); border-radius:50%; right:-38px; top:-42px; box-shadow:0 0 50px rgba(69,208,219,.08) inset; }

.startup-error { position:absolute; inset:0; z-index:30; display:grid; place-items:center; background:#020912; }
.error-card { max-width:500px; margin:20px; border:1px solid rgba(255,99,99,.25); padding:24px; border-radius:12px; background:#09121b; }
.error-card h2 { margin:7px 0; }
.error-card p { color:#9db1bb; line-height:1.55; }

@media (max-width: 900px) {
  .topbar { left:14px; right:14px; top:12px; }
  .turn-card { display:none; }
  .left-panel { left:14px; top:auto; bottom:58px; width:220px; padding:12px; }
  .placement-panel { right:14px; top:82px; width:270px; padding:13px; }
  .board-label { display:none; }
  .bottom-hint { bottom:12px; }
}
@media (max-width: 650px) {
  .eyebrow { display:none; }
  h1 { font-size:18px; }
  .topbar { gap:8px; }
  .button.ghost { padding:8px 9px; }
  .left-panel { left:10px; right:10px; width:auto; bottom:50px; }
  .mini-stats, .api-box, .last-action { display:none; }
  .placement-panel { left:10px; right:10px; top:auto; bottom:50px; width:auto; max-height:52vh; overflow:auto; }
  .ship-item { grid-template-columns:65px 1fr 45px; }
  .bottom-hint { display:none; }
}

/* Coilfire-specific tactical readouts */
.fleet-status { margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(97,216,255,.16); }
.fleet-line { display:flex; justify-content:space-between; gap:12px; padding:2px 0; font-size:11px; letter-spacing:.04em; }
.fleet-line b { color:#a6efff; font-weight:700; }
.fleet-line.total { margin-top:3px; padding-top:5px; border-top:1px dashed rgba(97,216,255,.15); }
.battle-log { margin-top:10px; max-height:116px; overflow:auto; padding-top:9px; border-top:1px solid rgba(97,216,255,.16); }
.battle-log p { margin:3px 0; font-size:10px; line-height:1.35; color:rgba(221,247,255,.72); }
@media (max-width:650px) {
  .fleet-status { display:none; }
  .battle-log { max-height:54px; }
}
