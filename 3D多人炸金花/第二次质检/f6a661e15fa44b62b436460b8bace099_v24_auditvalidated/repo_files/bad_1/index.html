<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#041208"/><title>Emerald Room · 炸金花</title><style>:root {
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: #f7f1e5;
  background: #040906;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  --gold: #d7b764;
  --gold-bright: #f2d890;
  --cream: #f8f0dd;
  --glass: rgba(3, 14, 9, 0.72);
  --glass-soft: rgba(255, 255, 255, 0.055);
  --hairline: rgba(255, 255, 255, 0.11);
  --muted: rgba(246, 242, 227, 0.46);
  --success: #d8b95f;
  --danger: #d65b68;
  --push: #86b7d9;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  width: 100%;
  min-width: 320px;
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
}

body {
  user-select: none;
}

button,
canvas {
  -webkit-tap-highlight-color: transparent;
}

button {
  font: inherit;
}

.app-shell {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 560px;
  overflow: hidden;
  background: #040906;
  isolation: isolate;
}

.scene-wrap {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.scene-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
  outline: none;
  touch-action: none;
}

.scene-wrap::before,
.scene-wrap::after,
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.scene-wrap::before {
  content: "";
  z-index: 1;
  background:
    radial-gradient(circle at 50% 25%, rgba(245, 216, 145, 0.065), transparent 30%),
    radial-gradient(circle at 13% 44%, rgba(77, 174, 126, 0.045), transparent 24%),
    radial-gradient(circle at 90% 65%, rgba(204, 166, 73, 0.025), transparent 30%);
  mix-blend-mode: screen;
}

.scene-wrap::after {
  content: "";
  z-index: 2;
  opacity: 0.12;
  background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px);
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.22), transparent 34%, transparent 70%, rgba(0,0,0,.18));
}

.vignette {
  z-index: 3;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 24%, rgba(1, 7, 4, 0.14) 62%, rgba(1, 5, 3, 0.82) 120%),
    linear-gradient(180deg, rgba(2, 7, 5, 0.5) 0%, transparent 21%, transparent 67%, rgba(2, 8, 5, 0.66) 100%);
}

.topbar {
  position: absolute;
  z-index: 12;
  top: calc(20px + env(safe-area-inset-top));
  left: max(24px, env(safe-area-inset-left));
  right: max(24px, env(safe-area-inset-right));
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  pointer-events: none;
}

.brand-block {
  justify-self: start;
  display: flex;
  gap: 12px;
  align-items: center;
  filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.34));
}

.brand-mark {
  position: relative;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  border: 1px solid rgba(236, 205, 125, 0.5);
  border-radius: 50%;
  color: #f0d995;
  background:
    radial-gradient(circle at 33% 28%, rgba(255, 239, 186, 0.17), transparent 26%),
    linear-gradient(145deg, rgba(224, 191, 106, 0.16), rgba(73, 50, 12, 0.12));
  box-shadow:
    inset 0 0 0 4px rgba(214, 180, 95, 0.05),
    inset 0 1px rgba(255, 255, 255, 0.15),
    0 12px 30px rgba(0, 0, 0, 0.24);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 18px;
  font-weight: 700;
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1px dashed rgba(240, 217, 151, 0.18);
  border-radius: inherit;
}

.eyebrow {
  color: rgba(238, 213, 152, 0.62);
  font-size: 8px;
  line-height: 1;
  letter-spacing: 0.34em;
  text-transform: uppercase;
}

.brand-block h1 {
  margin: 4px 0 0;
  color: #f8f1e0;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 24px;
  font-weight: 500;
  letter-spacing: 0.035em;
}

.scoreboard {
  justify-self: center;
  display: flex;
  align-items: center;
  gap: 15px;
  min-height: 43px;
  padding: 8px 17px;
  border: 1px solid rgba(255, 255, 255, 0.095);
  border-radius: 999px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015)),
    rgba(3, 12, 8, 0.5);
  box-shadow: 0 14px 42px rgba(0, 0, 0, 0.22), inset 0 1px rgba(255, 255, 255, 0.045);
  backdrop-filter: blur(18px) saturate(135%);
}

.score-chip {
  display: flex;
  align-items: baseline;
  gap: 7px;
  min-width: 48px;
}

.score-chip span {
  color: rgba(255, 255, 255, 0.42);
  font-size: 9px;
  letter-spacing: 0.12em;
}

.score-chip strong {
  color: #f5e4b4;
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.score-divider {
  width: 1px;
  height: 17px;
  background: linear-gradient(transparent, rgba(255,255,255,.16), transparent);
}

.round-meta {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 9px;
  pointer-events: auto;
}

.round-state {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 0 11px;
  border: 1px solid rgba(255,255,255,.075);
  border-radius: 999px;
  color: rgba(238, 238, 225, 0.58);
  background: rgba(2, 11, 7, 0.4);
  box-shadow: inset 0 1px rgba(255,255,255,.035);
  backdrop-filter: blur(14px);
  font-size: 8px;
  letter-spacing: 0.16em;
}

.phase-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #82c89d;
  box-shadow: 0 0 12px rgba(110, 210, 147, 0.72);
  animation: phasePulse 2.25s ease-in-out infinite;
}

.round-index {
  padding-left: 7px;
  border-left: 1px solid rgba(255,255,255,.08);
  color: rgba(239, 215, 155, 0.48);
  font-variant-numeric: tabular-nums;
}

.sound-toggle {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 50%;
  outline: none;
  color: rgba(255,255,255,.42);
  background: rgba(2, 11, 7, 0.46);
  box-shadow: inset 0 1px rgba(255,255,255,.05), 0 8px 20px rgba(0,0,0,.12);
  cursor: pointer;
  transition: transform 160ms ease, color 160ms ease, border-color 160ms ease, background 160ms ease;
}

.sound-toggle.on {
  color: #ead18a;
  border-color: rgba(222, 188, 98, 0.28);
  background: rgba(92, 70, 24, 0.2);
}

.sound-toggle:hover {
  transform: translateY(-2px);
  color: #f6e0a4;
  border-color: rgba(235, 204, 125, 0.35);
}

.sound-toggle:active {
  transform: translateY(0) scale(.94);
}

.sound-toggle:focus-visible,
.rebuy-button:focus-visible,
.action-button:focus-visible {
  outline: 2px solid rgba(245, 220, 151, 0.9);
  outline-offset: 3px;
}

.hand-hud {
  position: absolute;
  z-index: 7;
  left: 50%;
  display: grid;
  min-width: 130px;
  padding: 7px 15px 8px;
  justify-items: center;
  transform: translateX(-50%);
  border: 1px solid rgba(242, 221, 165, 0.09);
  border-radius: 15px;
  pointer-events: none;
  text-align: center;
  text-shadow: 0 3px 12px rgba(0, 0, 0, 0.55);
  background:
    linear-gradient(180deg, rgba(255,255,255,.03), transparent),
    rgba(2, 12, 8, 0.23);
  box-shadow: 0 10px 30px rgba(0,0,0,.09), inset 0 1px rgba(255,255,255,.035);
  backdrop-filter: blur(9px);
  transition: border-color 260ms ease, box-shadow 260ms ease, transform 260ms ease;
}

.computer-hud {
  top: calc(84px + env(safe-area-inset-top));
}

.player-hud {
  bottom: calc(178px + env(safe-area-inset-bottom));
}

.hand-hud.gold {
  border-color: rgba(235, 201, 111, 0.4);
  box-shadow: 0 0 30px rgba(215, 183, 91, 0.1), inset 0 1px rgba(255,255,255,.05);
}

.hand-hud.danger {
  border-color: rgba(214, 91, 104, 0.38);
  box-shadow: 0 0 30px rgba(214, 91, 104, 0.09), inset 0 1px rgba(255,255,255,.05);
}

.hud-label {
  color: rgba(229, 209, 153, 0.62);
  font-size: 8px;
  letter-spacing: 0.32em;
}

.hand-hud strong {
  margin-top: 1px;
  color: #fff8e8;
  font-family: Georgia, serif;
  font-size: 27px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.hand-hud.gold strong {
  color: #ffe29a;
}

.hand-hud.danger strong {
  color: #ffc0c7;
}

.hand-hud small {
  margin-top: 1px;
  color: rgba(255, 255, 255, 0.35);
  font-size: 8px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.result-flash {
  position: absolute;
  z-index: 15;
  left: 50%;
  top: 48%;
  display: grid;
  min-width: 190px;
  padding: 12px 22px 13px;
  place-items: center;
  transform: translate(-50%, -50%);
  border: 1px solid rgba(255,255,255,.13);
  border-radius: 18px;
  background: rgba(2, 11, 7, 0.76);
  box-shadow: 0 20px 70px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.07);
  backdrop-filter: blur(20px) saturate(140%);
  pointer-events: none;
  animation: resultArrive 720ms cubic-bezier(.2,.85,.2,1) both;
}

.result-flash::before {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  opacity: .7;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  padding: 1px;
  background: linear-gradient(120deg, transparent, rgba(245,216,139,.8), transparent);
}

.result-flash span {
  color: rgba(255,255,255,.62);
  font-size: 10px;
  letter-spacing: .16em;
}

.result-flash strong {
  margin-top: 2px;
  font-family: Georgia, serif;
  font-size: 30px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.result-flash.win strong { color: #f3d57d; }
.result-flash.loss strong { color: #ffb4bd; }
.result-flash.push strong { color: #b8def5; font-size: 24px; letter-spacing: .08em; }

.control-dock {
  position: absolute;
  z-index: 14;
  left: 50%;
  bottom: calc(44px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: minmax(205px, 1fr) auto auto auto minmax(210px, .86fr);
  align-items: stretch;
  width: min(1030px, calc(100% - 42px));
  min-height: 104px;
  padding: 13px 15px;
  transform: translateX(-50%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 25px;
  background:
    linear-gradient(138deg, rgba(255, 255, 255, 0.085), rgba(255, 255, 255, 0.026) 36%, rgba(0, 0, 0, 0.14) 72%),
    rgba(3, 13, 9, 0.69);
  box-shadow:
    0 28px 78px rgba(0, 0, 0, 0.48),
    0 2px 0 rgba(255,255,255,.025),
    inset 0 1px rgba(255, 255, 255, 0.085),
    inset 0 -1px rgba(0, 0, 0, 0.25);
  backdrop-filter: blur(28px) saturate(150%);
  transition: border-color 300ms ease, box-shadow 300ms ease, transform 220ms ease;
}

.control-dock::before {
  content: "";
  position: absolute;
  top: 0;
  left: 11%;
  right: 11%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(246, 220, 153, .32), transparent);
  opacity: .8;
}

.tone-win .control-dock {
  border-color: rgba(221, 186, 95, 0.38);
  box-shadow: 0 26px 78px rgba(0, 0, 0, 0.46), 0 0 48px rgba(211, 174, 82, 0.11), inset 0 1px rgba(255, 255, 255, 0.08);
}

.tone-loss .control-dock {
  border-color: rgba(190, 68, 80, 0.32);
  box-shadow: 0 26px 78px rgba(0, 0, 0, 0.46), 0 0 48px rgba(168, 37, 49, 0.1), inset 0 1px rgba(255, 255, 255, 0.08);
}

.tone-push .control-dock {
  border-color: rgba(119, 174, 211, 0.28);
}

.status-panel,
.bank-panel {
  display: flex;
  min-width: 0;
}

.status-panel {
  flex-direction: column;
  justify-content: center;
  padding: 6px 18px 6px 7px;
}

.status-line {
  display: flex;
  align-items: center;
  gap: 7px;
}

.status-kicker {
  color: rgba(255, 255, 255, 0.36);
  font-size: 8px;
  letter-spacing: 0.2em;
}

.status-phase {
  margin-left: auto;
  padding: 3px 6px;
  border: 1px solid rgba(255,255,255,.07);
  border-radius: 999px;
  color: rgba(255,255,255,.31);
  font-size: 7px;
  line-height: 1;
  letter-spacing: .12em;
}

.status-orb {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.36);
}

.status-orb.win { background: #e2bd5e; box-shadow: 0 0 12px rgba(226, 189, 94, 0.72); }
.status-orb.loss { background: #d45b68; box-shadow: 0 0 12px rgba(208, 80, 94, 0.62); }
.status-orb.push { background: #82b6da; box-shadow: 0 0 12px rgba(126, 175, 210, 0.62); }

.status-panel strong {
  overflow: hidden;
  margin-top: 5px;
  color: #f8f1e0;
  font-family: Georgia, serif;
  font-size: 18px;
  font-weight: 500;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 220ms ease;
}

.status-panel small {
  overflow: hidden;
  margin-top: 4px;
  color: rgba(255, 255, 255, 0.38);
  font-size: 9px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tone-win .status-panel strong { color: #ffe3a0; }
.tone-loss .status-panel strong { color: #ffc1c8; }
.tone-push .status-panel strong { color: #c7e7fb; }

.divider.vertical {
  align-self: center;
  width: 1px;
  height: 58px;
  margin: 0 8px;
  background: linear-gradient(transparent, rgba(255, 255, 255, 0.14), transparent);
}

.action-group {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
}

.action-button {
  position: relative;
  display: grid;
  grid-template-columns: 27px auto;
  grid-template-rows: 1fr auto;
  gap: 0 8px;
  min-width: 104px;
  height: 74px;
  padding: 13px 13px 10px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.105);
  border-radius: 17px;
  outline: none;
  color: rgba(255, 255, 255, 0.84);
  background:
    radial-gradient(circle at 25% 10%, rgba(255,255,255,.06), transparent 35%),
    rgba(255, 255, 255, 0.052);
  box-shadow:
    inset 0 1px rgba(255, 255, 255, 0.052),
    inset 0 -1px rgba(0,0,0,.14),
    0 8px 18px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  transform: translateZ(0);
  transition: transform 170ms cubic-bezier(.2,.75,.2,1), border-color 170ms ease, background 170ms ease, box-shadow 170ms ease, opacity 170ms ease, filter 170ms ease;
}

.action-button::before {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-110%);
  background: linear-gradient(105deg, transparent 28%, rgba(255,255,255,.12), transparent 64%);
  transition: transform 420ms ease;
  pointer-events: none;
}

.action-button:hover:not(:disabled) {
  transform: translateY(-5px);
  border-color: rgba(236, 212, 150, 0.28);
  background: rgba(255, 255, 255, 0.082);
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.075), 0 15px 26px rgba(0, 0, 0, 0.2);
}

.action-button:hover:not(:disabled)::before {
  transform: translateX(115%);
}

.action-button:active:not(:disabled) {
  transform: translateY(-1px) scale(0.965);
  transition-duration: 70ms;
}

.action-button.primary {
  border-color: rgba(229, 196, 109, 0.5);
  color: #1a1206;
  background:
    radial-gradient(circle at 25% 15%, rgba(255,255,255,.38), transparent 31%),
    linear-gradient(145deg, #efd58f, #c99e48 82%);
  box-shadow:
    inset 0 1px rgba(255, 255, 255, 0.5),
    inset 0 -1px rgba(84,51,2,.26),
    0 11px 30px rgba(185, 139, 45, 0.18);
}

.action-button.primary::after {
  content: "";
  position: absolute;
  inset: 2px;
  border-radius: 14px;
  pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.action-button.primary:hover:not(:disabled) {
  border-color: rgba(255, 237, 185, 0.78);
  background: linear-gradient(145deg, #f7dfa2, #d4a954);
  box-shadow: inset 0 1px rgba(255,255,255,.5), 0 16px 34px rgba(188, 142, 48, .22);
}

.action-button:disabled {
  opacity: 0.24;
  cursor: default;
  filter: saturate(0.45) contrast(.9);
  transform: none;
}

.action-icon {
  grid-row: 1 / span 2;
  align-self: center;
  min-width: 27px;
  font-family: Georgia, serif;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
}

.action-button > span:nth-child(2) {
  align-self: end;
  white-space: nowrap;
  font-size: 12px;
  font-weight: 750;
  letter-spacing: 0.055em;
}

.action-button kbd {
  align-self: start;
  justify-self: start;
  margin-top: 3px;
  padding: 0;
  border: 0;
  color: currentColor;
  background: transparent;
  font-family: inherit;
  font-size: 7px;
  line-height: 1;
  opacity: 0.42;
}

.bank-panel {
  position: relative;
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 5px 6px 5px 14px;
}

.chip-token {
  position: relative;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 4px dashed rgba(255,255,255,.68);
  border-radius: 50%;
  background: linear-gradient(145deg, #d8b65f, #876523);
  box-shadow: inset 0 0 0 3px #c49e48, 0 7px 16px rgba(0,0,0,.22);
  transform: rotate(8deg);
}

.chip-token i {
  width: 11px;
  height: 11px;
  border: 1px solid rgba(57,37,7,.3);
  border-radius: 50%;
  background: rgba(255,242,200,.24);
}

.bank-item {
  min-width: 66px;
}

.bank-item span {
  display: block;
  color: rgba(255, 255, 255, 0.36);
  font-size: 8px;
  letter-spacing: 0.11em;
}

.bank-item strong {
  display: block;
  margin-top: 4px;
  color: #f3d98e;
  font-family: Georgia, serif;
  font-size: 22px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.bank-item.bet strong {
  color: rgba(255, 255, 255, 0.78);
}

.bank-divider {
  width: 1px;
  height: 35px;
  background: linear-gradient(transparent, rgba(255,255,255,.13), transparent);
}

.rebuy-button {
  min-height: 36px;
  padding: 0 11px;
  border: 1px solid rgba(235, 205, 126, 0.3);
  border-radius: 11px;
  outline: none;
  color: #ead18d;
  background: rgba(216, 183, 95, 0.08);
  cursor: pointer;
  font-size: 10px;
  letter-spacing: .05em;
  transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
}

.rebuy-button:hover {
  transform: translateY(-2px);
  border-color: rgba(235, 205, 126, 0.48);
  background: rgba(216, 183, 95, 0.14);
}

.rebuy-button:active {
  transform: scale(.97);
}

.hint-strip {
  position: absolute;
  z-index: 9;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom));
  display: flex;
  gap: 9px;
  align-items: center;
  transform: translateX(-50%);
  color: rgba(255, 255, 255, 0.25);
  font-size: 8px;
  letter-spacing: 0.055em;
  pointer-events: none;
  white-space: nowrap;
}

.hint-dot {
  opacity: 0.44;
}

@keyframes phasePulse {
  0%, 100% { opacity: 0.48; transform: scale(0.92); }
  50% { opacity: 1; transform: scale(1.14); }
}

@keyframes resultArrive {
  0% { opacity: 0; transform: translate(-50%, -44%) scale(.88); filter: blur(5px); }
  42% { opacity: 1; transform: translate(-50%, -52%) scale(1.035); filter: blur(0); }
  100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
}

@media (max-width: 940px) {
  .scoreboard {
    gap: 10px;
    padding-inline: 13px;
  }

  .control-dock {
    grid-template-columns: minmax(176px, 1fr) auto auto auto minmax(164px, .8fr);
    width: calc(100% - 26px);
  }

  .action-button {
    min-width: 94px;
    padding-inline: 11px;
  }

  .chip-token {
    display: none;
  }
}

@media (max-width: 780px) {
  .app-shell {
    min-height: 540px;
  }

const deckGroup=new THREE.Group();deckGroup.position.set(0,.31,0);scene.add(deckGroup);const backTexture=createBackTexture();for(let i=0;i<8;i++){const g=new THREE.PlaneGeometry(CARD_W,CARD_H,8,2);bendGeometry(g,.025);const card=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:backTexture,roughness:.58,side:THREE.DoubleSide}));card.rotation.x=-Math.PI/2;card.position.y=i*.013;deckGroup.add(card)}
function bendGeometry(geometry,amount=CARD_BEND){const p=geometry.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i);const z=Math.sin((x/CARD_W+.5)*Math.PI)*amount;p.setZ(i,z)}p.needsUpdate=true;geometry.computeVertexNormals()}
function createBackTexture(){const c=document.createElement('canvas');c.width=360;c.height=520;const x=c.getContext('2d');x.fillStyle='#071a23';x.fillRect(0,0,360,520);x.strokeStyle='#c6a75c';x.lineWidth=8;x.strokeRect(14,14,332,492);x.strokeStyle='#71858a';x.lineWidth=3;x.strokeRect(28,28,304,464);x.globalAlpha=.28;for(let y=46;y<480;y+=24)for(let q=45;q<320;q+=24){x.save();x.translate(q,y);x.rotate(Math.PI/4);x.strokeRect(-7,-7,14,14);x.restore()}x.globalAlpha=1;x.fillStyle='#d8bd6c';x.font='bold 42px Georgia';x.textAlign='center';x.fillText('3',180,276);return new THREE.CanvasTexture(c)}
function createTexture(rank,suit){const c=document.createElement('canvas');c.width=420;c.height=600;const x=c.getContext('2d');x.fillStyle='#eeece4';x.fillRect(0,0,420,600);x.strokeStyle='#1d2928';x.lineWidth=4;x.strokeRect(12,12,396,576);const red=suit==='H'||suit==='D';x.fillStyle=red?'#b31f2a':'#111817';x.font='bold 50px Georgia';x.fillText(rank,24,66);x.font='44px Georgia';x.fillText(SUIT_SYMBOL[suit],25,116);x.textAlign='center';x.font='108px Georgia';x.fillText(SUIT_SYMBOL[suit],210,342);const t=new THREE.CanvasTexture(c);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}
const sceneCards=new Map(), sceneChips=[];
function createCardEntity(card,owner,index){const group=new THREE.Group();const geo=new THREE.PlaneGeometry(CARD_W,CARD_H,12,3);bendGeometry(geo);const frontTex=createTexture(card.rank,card.suit);const fm=new THREE.MeshStandardMaterial({map:frontTex,roughness:.55,metalness:.015,side:THREE.DoubleSide});const bm=new THREE.MeshStandardMaterial({map:backTexture,roughness:.62,metalness:.02,side:THREE.DoubleSide});const front=new THREE.Mesh(geo,fm);front.position.z=.016;const back=new THREE.Mesh(geo.clone(),bm);back.rotation.y=Math.PI;back.position.z=-.016;group.add(front,back);group.position.set(POS.deck.x+.03,POS.deck.y,POS.deck.z);group.rotation.x=Math.PI/2;group.castShadow=true;scene.add(group);const e={id:card.id,owner,rank:card.rank,suit:card.suit,faceUp:false,group,front,back,frontTex,geos:[geo,back.geometry],mats:[fm,bm]};sceneCards.set(card.id,e);return e}
function disposeRoundObjects(){for(const e of sceneCards.values()){scene.remove(e.group);e.geos.forEach(g=>g.dispose());e.mats.forEach(m=>m.dispose());e.frontTex.dispose()}sceneCards.clear();for(const ch of sceneChips.splice(0)){scene.remove(ch.mesh);ch.mesh.geometry.dispose();ch.mesh.material.dispose()}}
const animations=[];
function animate(duration,update,delay=0){return new Promise(resolve=>animations.push({start:performance.now()+delay,duration,update,resolve}))}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function lerp3(a,b,t){return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t}}
function moveEntity(e,target,duration=560,delay=0,arc=.6){const from={x:e.group.position.x,y:e.group.position.y,z:e.group.position.z};return animate(duration,t=>{const q=ease(t),p=lerp3(from,target,q);e.group.position.set(p.x,p.y+Math.sin(Math.PI*q)*arc,p.z)},delay)}
function chipFlight(owner,amount){const color=owner==='player'?'#d9bd66':'#738a8d',end={x:(Math.random()-.5)*.8,y:.34,z:(Math.random()-.5)*.55};const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.09,36),new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.35}));mesh.position.set(end.x,end.y,end.z);scene.add(mesh);const rec={id:`chip-${++chipSerial}`,owner:'pot',position:end,mesh,amount};sceneChips.push(rec);return rec}

function updateButtons(){const s=publicState();for(const k of ['deal','peek','call','raise','fold','compare']){const b=document.querySelector(`[data-testid="${k}-btn"]`);const prop=k==='deal'?'canDeal':'can'+k[0].toUpperCase()+k.slice(1);b.disabled=!s[prop]}}
function fmtCard(c){return `${c.rank}${SUIT_SYMBOL[c.suit]}`}
function statusCopy(){if(game.phase==='eliminated')return['最终胜利 / 淘汰',game.winner==='player'?'电脑筹码不足，你赢下牌桌':'你的筹码不足，电脑赢下牌桌','eliminated'];if(game.phase==='round_over'){const who=game.winner==='player'?'真人胜利':game.winner==='computer'?'电脑胜利':'平分奖池';const why=game.outcome==='fold'?'弃牌结算':game.outcome==='compare'?'比牌结算':'胜利';return[who,why,game.winner==='player'?'win':game.winner==='computer'?'loss':'compare']}if(game.phase==='comparing')return['比牌','双方移牌至中央并翻牌','compare'];if(game.phase==='computer_turn')return['电脑行动','电脑正在根据牌力与下注决策',''];if(game.phase==='player_turn')return['轮到你','看牌、跟注、加注、弃牌或比牌',''];if(game.phase==='dealing')return['发牌中','三张暗牌正在入位',''];return['等待','点击发牌开始 1v1 对局','']}
function paint(){const q=s=>document.querySelector(`[data-testid="${s}"]`),txt=(id,v)=>{const e=q(id);if(e)e.textContent=String(v)};txt('player-chips',game.player.chips);txt('computer-chips',game.computer.chips);txt('player-score',game.score.player);txt('computer-score',game.score.computer);txt('current-bet',game.currentBet);txt('pot',game.pot);txt('turn',game.turn==='player'?'真人玩家':game.turn==='computer'?'电脑玩家':'等待');txt('player-hand',game.player.cards.length?(game.player.looked?game.player.cards.map(fmtCard).join('  '):'•••  •••  •••'):'未发牌');txt('player-hand-type',game.player.looked?(game.player.handType||'计算中'):'未看牌');const [a,b,c]=statusCopy(),st=q('game-status');if(st){st.dataset.tone=c||'normal';const title=st.querySelector('[data-zjh-status-title]');const sub=st.querySelector('[data-zjh-status-sub]');if(title)title.textContent=a;else st.textContent=a;if(sub)sub.textContent=b}const pn=document.getElementById('player-note'),cn=document.getElementById('computer-note');if(pn)pn.textContent=game.player.looked?`${game.player.handType} · 已看牌`:(game.player.cards.length?'三张暗牌 · 未看':'等待发牌');if(cn)cn.textContent=(game.phase==='round_over'||game.phase==='eliminated')?`${game.computer.handType||'暗牌'} · 本局结束`:'三张暗牌 · 自动决策';root.dataset.winner=game.winner||'';root.dataset.phase=game.phase;updateButtons()}
function winnerColor(winner){return winner==='player'?'#3adf8b':winner==='computer'?'#ff6677':'#e7c46d'}

async function dealRound(){if(!publicState().canDeal)return;if(game.player.chips<ANTE||game.computer.chips<ANTE){game.phase='eliminated';game.turn=null;game.winner=game.player.chips>=game.computer.chips?'player':'computer';game.outcome='elimination';paint();return}actionLock=true;settled=false;disposeRoundObjects();game.round++;game.phase='dealing';game.turn=null;game.pot=0;game.currentBet=ANTE*2;game.winner=null;game.outcome=null;for(const side of [game.player,game.computer]){side.roundBet=0;side.looked=false;side.folded=false;side.handType=null;side.cards=[]}game.player.chips-=ANTE;game.computer.chips-=ANTE;game.player.roundBet=ANTE;game.computer.roundBet=ANTE;game.pot=ANTE*2;const deck=makeDeck();const jobs=[];for(let i=0;i<3;i++){for(const owner of ['player','computer']){const card=deck.pop();game[owner].cards.push(card);const e=createCardEntity(card,owner,i);const a=POS[owner][i],target={x:a[0],y:a[1],z:a[2]};jobs.push(moveEntity(e,target,800,220+i*120+(owner==='computer'?18:0),.72))}}paint();await Promise.all(jobs);game.phase='player_turn';game.turn='player';actionLock=false;paint()}
async function peek(){if(!publicState().canPeek)return;actionLock=true;game.player.handType=evaluateHand(game.player.cards).name;const jobs=game.player.cards.map((c,i)=>{const e=sceneCards.get(c.id);const startX=e.group.position.x,startZ=e.group.position.z,startRot=e.group.rotation.x;const tx=(-1.22+i*1.22),tz=3.15+Math.abs(i-1)*.18;return animate(620,t=>{const q=ease(t);e.group.position.x=startX+(tx-startX)*q;e.group.position.z=startZ+(tz-startZ)*q;e.group.rotation.x=startRot+(-Math.PI/2-startRot)*q;e.group.rotation.z=(i-1)*-.12*q;if(t>.48){c.faceUp=true;e.faceUp=true}})});paint();await Promise.all(jobs);game.player.cards.forEach(c=>c.faceUp=true);game.player.looked=true;actionLock=false;paint()}
function amountDue(side,target=game.currentBet){return Math.max(0,target-game[side].roundBet)}
function commitStake(side,amount){amount=Math.max(0,Math.min(amount,game[side].chips));game[side].chips-=amount;game[side].roundBet+=amount;game.pot+=amount;if(amount>0)chipFlight(side,amount);return amount}
function computerDecision(){const hand=evaluateHand(game.computer.cards);const strength=hand.strength;const price=game.currentBet/Math.max(1,game.computer.chips);const potHeat=game.pot/Math.max(1,game.computer.chips);const canPay=game.computer.chips>=amountDue('computer'); // Emerald: cautious / trap-heavy
 if(!canPay)return'fold';if(strength>=112&&game.pot>=180)return'compare';if(strength<43&&(price>.062||potHeat>.36))return'fold';if(strength>=98&&price<.07&&game.currentBet<=80&&game.computer.chips>=amountDue('computer',game.currentBet+RAISE_STEP))return'raise';return'call'}
async function computerAction(){if(game.phase!=='computer_turn'||settled)return;const action=computerDecision();await wait(120);if(action==='fold'){game.computer.folded=true;await settle('player','fold');return}if(action==='compare'){await compareRound(true);return}if(action==='raise'){game.currentBet+=RAISE_STEP;commitStake('computer',amountDue('computer'))}else commitStake('computer',amountDue('computer'));paint();await wait(390);if(!settled){game.phase='player_turn';game.turn='player';actionLock=false;paint()}}
async function playerCall(){if(!publicState().canCall)return;actionLock=true;commitStake('player',amountDue('player'));game.phase='computer_turn';game.turn='computer';paint();computerAction()}
async function playerRaise(){if(!publicState().canRaise)return;actionLock=true;game.currentBet+=RAISE_STEP;commitStake('player',amountDue('player'));game.phase='computer_turn';game.turn='computer';paint();computerAction()}
async function playerFold(){if(!publicState().canFold)return;actionLock=true;game.player.folded=true;await settle('computer','fold')}
async function settle(winner,outcome){if(settled)return;settled=true;actionLock=true;game.winner=winner;game.outcome=outcome;game.turn=null;if(winner==='player'){game.player.chips+=game.pot;game.score.player++}else if(winner==='computer'){game.computer.chips+=game.pot;game.score.computer++}else{const half=game.pot/2;game.player.chips+=half;game.computer.chips+=game.pot-half}game.pot=0;game.currentBet=0;const eliminated=game.player.chips<ANTE||game.computer.chips<ANTE;game.phase=eliminated?'eliminated':'round_over';if(eliminated){game.outcome='elimination';game.winner=game.player.chips>=ANTE?'player':'computer'}actionLock=false;paint()}
async function compareRound(fromComputer=false){if(!fromComputer&&!publicState().canCompare)return;if(settled)return;actionLock=true;game.phase='comparing';game.turn=null;game.player.handType=evaluateHand(game.player.cards).name;game.computer.handType=evaluateHand(game.computer.cards).name;const all=[...game.player.cards.map((c,i)=>['player',c,i]),...game.computer.cards.map((c,i)=>['computer',c,i])];paint();const jobs=all.map(([owner,c,i])=>{const e=sceneCards.get(c.id),sx=e.group.position.x,sy=e.group.position.y,sz=e.group.position.z,sr=e.group.rotation.x;const tx=-2.05+(owner==='player'?i:i+3)*.82,tz=owner==='player'?.55:-.55;return animate(760,t=>{const q=ease(t);e.group.position.set(sx+(tx-sx)*q,sy+Math.sin(Math.PI*q)*.75,sz+(tz-sz)*q);e.group.rotation.x=sr+(-Math.PI/2-sr)*q;e.group.rotation.z=(owner==='player'?.04:-.04)*(i-1)*q;if(t>.40){c.faceUp=true;e.faceUp=true;e.owner='compare'}})});await Promise.all(jobs);const result=compareHands(game.player.cards,game.computer.cards);await wait(120);await settle(result>0?'player':result<0?'computer':null,'compare')}

document.querySelector('[data-testid="deal-btn"]').addEventListener('click',dealRound);document.querySelector('[data-testid="peek-btn"]').addEventListener('click',peek);document.querySelector('[data-testid="call-btn"]').addEventListener('click',playerCall);document.querySelector('[data-testid="raise-btn"]').addEventListener('click',playerRaise);document.querySelector('[data-testid="fold-btn"]').addEventListener('click',playerFold);document.querySelector('[data-testid="compare-btn"]').addEventListener('click',()=>compareRound(false));

window.__scene={getState:()=>({ready:game.ready,threeRevision:String(THREE.REVISION),renderer:{ready:!!renderer,type:'WebGLRenderer'},canvas:{width:renderer.domElement.width,height:renderer.domElement.height},camera:{type:'PerspectiveCamera',fov:camera.fov,near:camera.near,far:camera.far,aspect:camera.aspect,position:{x:camera.position.x,y:camera.position.y,z:camera.position.z},target:{x:controls.target.x,y:controls.target.y,z:controls.target.z}},ambientLight:{exists:!!ambient,intensity:ambient.intensity},orbitControls:{enabled:controls.enabled,target:{x:controls.target.x,y:controls.target.y,z:controls.target.z}},table:{color:TABLE_COLOR,roughness:tableMat.roughness,position:{x:table.position.x,y:table.position.y,z:table.position.z}},deck:{count:Math.max(0,52-game.player.cards.length-game.computer.cards.length),position:{x:POS.deck.x,y:POS.deck.y,z:POS.deck.z}},cards:[...sceneCards.values()].map(e=>({id:e.id,owner:e.owner,rank:e.rank,suit:e.suit,faceUp:e.faceUp,position:{x:e.group.position.x,y:e.group.position.y,z:e.group.position.z},rotation:{x:e.group.rotation.x,y:e.group.rotation.y,z:e.group.rotation.z}})),chips:sceneChips.map(c=>({id:c.id,owner:c.owner,position:{x:c.mesh.position.x,y:c.mesh.position.y,z:c.mesh.position.z}}))})};
function frame(now){for(let i=animations.length-1;i>=0;i--){const a=animations[i];if(now<a.start)continue;const t=Math.min(1,(now-a.start)/a.duration);a.update(t);if(t>=1){animations.splice(i,1);a.resolve()}}controls.update();renderer.render(scene,camera);setTimeout(()=>requestAnimationFrame(frame),18)}

})();</script></body></html>
