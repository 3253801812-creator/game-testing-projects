:root {

* { box-sizing: border-box; }
html, body, #root { margin: 0; width: 100%; min-width: 320px; height: 100%; overflow: hidden; }

.action-cluster { display: grid; grid-template-columns: 1.16fr 1fr 1fr; gap: 8px; min-width: 0; }
.game-button {
  --lift: 0px;
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  min-width: 0;
  min-height: 56px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.115);
  border-radius: 17px;
  padding: 8px 10px;
  color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.095), rgba(255,255,255,.037));
  box-shadow: inset 0 1px rgba(255,255,255,.09), 0 7px 19px rgba(0,0,0,.18);
  transform: translateY(var(--lift)) translateZ(0);
  transition:
    transform .16s cubic-bezier(.2,.8,.2,1),
    border-color .18s ease,
    background .18s ease,
    box-shadow .18s ease,
    opacity .18s ease,
    filter .18s ease;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.game-button::before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  background: radial-gradient(circle at 50% 120%, rgba(255,255,255,.13), transparent 58%);
  opacity: 0;
  transform: translateY(16%);
  transition: opacity .18s ease, transform .2s ease;
}
.game-button:hover:not(:disabled) {
  --lift: -3px;
  border-color: rgba(255,255,255,.24);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.052));
  box-shadow: inset 0 1px rgba(255,255,255,.13), 0 12px 26px rgba(0,0,0,.25);
}
.game-button:hover:not(:disabled)::before { opacity: 1; transform: translateY(0); }
.game-button:active:not(:disabled) {
  --lift: 1px;
  transform: translateY(var(--lift)) scale(.975) translateZ(0);
  transition-duration: .055s;
  box-shadow: inset 0 2px 5px rgba(0,0,0,.17), 0 4px 12px rgba(0,0,0,.2);
}
.game-button:disabled {
  cursor: not-allowed;
  opacity: .28;
  filter: saturate(.5);
  box-shadow: inset 0 1px rgba(255,255,255,.04);
}
.game-button.primary {

  box-shadow: inset 0 1px rgba(255,239,191,.15), 0 9px 24px rgba(66,43,7,.24);
}
.game-button.primary::after {
  content: '';

  right: 16%;

.feedback-flash { animation: feedback-in .9s ease-out both; }
.feedback-flash.win { background: radial-gradient(ellipse at 50% 52%, rgba(16,185,129,.12), transparent 58%); }

.game-over-card { width: min(92vw, 350px); border-radius: 28px; padding: 27px 28px 25px; text-align: center; }

const deckLabelCanvas=document.createElement('canvas');deckLabelCanvas.width=360;deckLabelCanvas.height=72;const deckLabelCtx=deckLabelCanvas.getContext('2d');deckLabelCtx.font='600 24px Arial';deckLabelCtx.textAlign='center';deckLabelCtx.fillStyle='rgba(216,187,115,.78)';deckLabelCtx.fillText('DECK · 牌堆',180,42);const deckLabelTexture=new THREE.CanvasTexture(deckLabelCanvas);const deckLabel=new THREE.Sprite(new THREE.SpriteMaterial({map:deckLabelTexture,transparent:true,depthWrite:false}));deckLabel.scale.set(2.1,.42,1);deckLabel.position.set(0,.72,.95);scene.add(deckLabel);

function fmtCard(c){return `${c.rank}${SUIT_SYMBOL[c.suit]}`}
function statusCopy(){if(game.phase==='eliminated')return['最终胜利 / 淘汰',game.winner==='player'?'电脑筹码不足，你赢下牌桌':'你的筹码不足，电脑赢下牌桌','eliminated'];if(game.phase==='round_over'){const who=game.winner==='player'?'真人胜利':game.winner==='computer'?'电脑胜利':'平分奖池';const why=game.outcome==='fold'?'弃牌结算':game.outcome==='compare'?'比牌结算':'胜利';return[who,why,game.winner==='player'?'win':game.winner==='computer'?'loss':'compare']}if(game.phase==='comparing')return['比牌','双方移牌至中央并翻牌','compare'];if(game.phase==='computer_turn')return['电脑行动','电脑正在根据牌力与下注决策',''];if(game.phase==='player_turn')return['轮到你','看牌、跟注、加注、弃牌或比牌',''];if(game.phase==='dealing')return['发牌中','三张暗牌正在入位',''];return['等待','点击发牌开始 1v1 对局','']}
function paint(){const q=s=>document.querySelector(`[data-testid="${s}"]`),txt=(id,v)=>{const e=q(id);if(e)e.textContent=String(v)};txt('player-chips',game.player.chips);txt('computer-chips',game.computer.chips);txt('player-score',game.score.player);txt('computer-score',game.score.computer);txt('current-bet',game.currentBet);txt('pot',game.pot);txt('turn',game.turn==='player'?'真人玩家':game.turn==='computer'?'电脑玩家':'等待');txt('player-hand',game.player.cards.length?(game.player.looked?game.player.cards.map(fmtCard).join('  '):'•••  •••  •••'):'未发牌');txt('player-hand-type',game.player.looked?(game.player.handType||'计算中'):'未看牌');const [a,b,c]=statusCopy(),st=q('game-status');if(st){st.dataset.tone='normal';const title=st.querySelector('[data-zjh-status-title]');const sub=st.querySelector('[data-zjh-status-sub]');if(title)title.textContent=a;else st.textContent=a;if(sub)sub.textContent=b}const pn=document.getElementById('player-note'),cn=document.getElementById('computer-note');if(pn)pn.textContent=game.player.looked?`${game.player.handType} · 已看牌`:(game.player.cards.length?'三张暗牌 · 未看':'等待发牌');if(cn)cn.textContent=(game.phase==='round_over'||game.phase==='eliminated')?`${game.computer.handType||'暗牌'} · 本局结束`:'三张暗牌 · 自动决策';root.dataset.winner=game.winner||'';root.dataset.phase=game.phase;updateButtons()}
function winnerColor(winner){return winner==='player'?'#3adf8b':winner==='computer'?'#ff6677':'#e7c46d'}

async function dealRound(){if(!publicState().canDeal)return;if(game.player.chips<ANTE||game.computer.chips<ANTE){game.phase='eliminated';game.turn=null;game.winner=game.player.chips>=game.computer.chips?'player':'computer';game.outcome='elimination';paint();return}actionLock=true;settled=false;disposeRoundObjects();game.round++;game.phase='dealing';game.turn=null;game.pot=0;game.currentBet=ANTE*2;game.winner=null;game.outcome=null;for(const side of [game.player,game.computer]){side.roundBet=0;side.looked=false;side.folded=false;side.handType=null;side.cards=[]}game.player.chips-=ANTE;game.computer.chips-=ANTE;game.player.roundBet=ANTE;game.computer.roundBet=ANTE;game.pot=ANTE*2;const deck=makeDeck();const jobs=[];for(let i=0;i<3;i++){for(const owner of ['player','computer']){const card=deck.pop();game[owner].cards.push(card);const e=createCardEntity(card,owner,i);const a=POS[owner][i],target={x:a[0],y:a[1],z:a[2]};jobs.push(moveEntity(e,target,800,220+i*120+(owner==='computer'?18:0),.72))}}paint();await Promise.all(jobs);game.phase='player_turn';game.turn='player';actionLock=false;paint()}
async function peek(){if(!publicState().canPeek)return;actionLock=true;game.player.handType=evaluateHand(game.player.cards).name;const jobs=game.player.cards.map((c,i)=>{const e=sceneCards.get(c.id);const startX=e.group.position.x,startZ=e.group.position.z,startRot=e.group.rotation.x;const tx=(-1.22+i*1.22),tz=3.15+Math.abs(i-1)*.18;return animate(620,t=>{const q=ease(t);e.group.position.x=startX+(tx-startX)*q;e.group.position.z=startZ+(tz-startZ)*q;e.group.rotation.x=startRot+(-Math.PI/2-startRot)*q;e.group.rotation.z=(i-1)*-.12*q;if(t>.48){c.faceUp=true;e.faceUp=true}})});paint();await Promise.all(jobs);game.player.cards.forEach(c=>c.faceUp=true);game.player.looked=true;actionLock=false;paint()}
function amountDue(side,target=game.currentBet){return Math.max(0,target-game[side].roundBet)}
function commitStake(side,amount){amount=Math.max(0,Math.min(amount,game[side].chips));game[side].chips-=amount;game[side].roundBet+=amount;game.pot+=amount;if(amount>0)chipFlight(side,amount);return amount}
function computerDecision(){const hand=evaluateHand(game.computer.cards);const strength=hand.strength;const risk=game.currentBet/Math.max(1,game.computer.chips);const reward=game.pot/Math.max(1,game.currentBet);const enough=game.computer.chips>=amountDue('computer'); // Minimal: conservative, low-noise
 if(!enough)return'fold';if(strength>=118&&game.pot>240)return'compare';if(strength<40&&risk>.07)return'fold';if(strength>94&&risk<.08&&reward>2.2&&game.computer.chips>=amountDue('computer',game.currentBet+RAISE_STEP))return'raise';return'call'}
async function computerAction(){if(game.phase!=='computer_turn'||settled)return;const action=computerDecision();await wait(120);if(action==='fold'){game.computer.folded=true;await settle('player','fold');return}if(action==='compare'){await compareRound(true);return}if(action==='raise'){game.currentBet+=RAISE_STEP;commitStake('computer',amountDue('computer'))}else commitStake('computer',amountDue('computer'));paint();await wait(390);if(!settled){game.phase='player_turn';game.turn='player';actionLock=false;paint()}}
async function playerCall(){if(!publicState().canCall)return;actionLock=true;commitStake('player',amountDue('player'));game.phase='computer_turn';game.turn='computer';paint();computerAction()}
async function playerRaise(){if(!publicState().canRaise)return;actionLock=true;game.currentBet+=RAISE_STEP;commitStake('player',amountDue('player'));game.phase='computer_turn';game.turn='computer';paint();computerAction()}
async function playerFold(){if(!publicState().canFold)return;actionLock=true;game.player.folded=true;await settle('computer','fold')}
async function settle(winner,outcome){if(settled)return;settled=true;actionLock=true;game.winner=winner;game.outcome=outcome;game.turn=null;if(winner==='player'){game.player.chips+=game.pot;game.score.player++}else if(winner==='computer'){game.computer.chips+=game.pot;game.score.computer++}else{const half=game.pot/2;game.player.chips+=half;game.computer.chips+=game.pot-half}game.pot=0;game.currentBet=0;const eliminated=game.player.chips<ANTE||game.computer.chips<ANTE;game.phase=eliminated?'eliminated':'round_over';if(eliminated){game.outcome='elimination';game.winner=game.player.chips>=ANTE?'player':'computer'}actionLock=false;paint()}
async function compareRound(fromComputer=false){if(!fromComputer&&!publicState().canCompare)return;if(settled)return;actionLock=true;game.phase='comparing';game.turn=null;game.player.handType=evaluateHand(game.player.cards).name;game.computer.handType=evaluateHand(game.computer.cards).name;const all=[...game.player.cards.map((c,i)=>['player',c,i]),...game.computer.cards.map((c,i)=>['computer',c,i])];paint();const jobs=all.map(([owner,c,i])=>{const e=sceneCards.get(c.id),sx=e.group.position.x,sy=e.group.position.y,sz=e.group.position.z,sr=e.group.rotation.x;const tx=-2.05+(owner==='player'?i:i+3)*.82,tz=owner==='player'?.55:-.55;return animate(760,t=>{const q=ease(t);e.group.position.set(sx+(tx-sx)*q,sy+Math.sin(Math.PI*q)*.75,sz+(tz-sz)*q);e.group.rotation.x=sr+(-Math.PI/2-sr)*q;e.group.rotation.z=(owner==='player'?.04:-.04)*(i-1)*q;if(t>.40){c.faceUp=true;e.faceUp=true;e.owner='compare'}})});await Promise.all(jobs);const result=compareHands(game.player.cards,game.computer.cards);await wait(120);await settle(result>0?'player':result<0?'computer':null,'compare')}

document.querySelector('[data-testid="deal-btn"]').addEventListener('click',dealRound);document.querySelector('[data-testid="peek-btn"]').addEventListener('click',peek);document.querySelector('[data-testid="call-btn"]').addEventListener('click',playerCall);document.querySelector('[data-testid="raise-btn"]').addEventListener('click',playerRaise);document.querySelector('[data-testid="fold-btn"]').addEventListener('click',playerFold);document.querySelector('[data-testid="compare-btn"]').addEventListener('click',()=>compareRound(false));
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio,.72));renderer.setSize(innerWidth,innerHeight)}window.addEventListener('resize',onResize);
window.__scene={getState:()=>({ready:game.ready,threeRevision:String(THREE.REVISION),renderer:{ready:!!renderer,type:'WebGLRenderer'},canvas:{width:renderer.domElement.width,height:renderer.domElement.height},camera:{type:'PerspectiveCamera',fov:camera.fov,near:camera.near,far:camera.far,aspect:camera.aspect,position:{x:camera.position.x,y:camera.position.y,z:camera.position.z},target:{x:controls.target.x,y:controls.target.y,z:controls.target.z}},ambientLight:{exists:!!ambient,intensity:ambient.intensity},orbitControls:{enabled:controls.enabled,target:{x:controls.target.x,y:controls.target.y,z:controls.target.z}},table:{color:TABLE_COLOR,roughness:tableMat.roughness,position:{x:table.position.x,y:table.position.y,z:table.position.z}},deck:{count:Math.max(0,52-game.player.cards.length-game.computer.cards.length),position:{x:POS.deck.x,y:POS.deck.y,z:POS.deck.z}},cards:[...sceneCards.values()].map(e=>({id:e.id,owner:e.owner,rank:e.rank,suit:e.suit,faceUp:e.faceUp,position:{x:e.group.position.x,y:e.group.position.y,z:e.group.position.z},rotation:{x:e.group.rotation.x,y:e.group.rotation.y,z:e.group.rotation.z}})),chips:sceneChips.map(c=>({id:c.id,owner:c.owner,position:{x:c.mesh.position.x,y:c.mesh.position.y,z:c.mesh.position.z}}))})};
function frame(now){for(let i=animations.length-1;i>=0;i--){const a=animations[i];if(now<a.start)continue;const t=Math.min(1,(now-a.start)/a.duration);a.update(t);if(t>=1){animations.splice(i,1);a.resolve()}}controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}
game.ready=true;paint();requestAnimationFrame(frame);

})();</script></body></html>
