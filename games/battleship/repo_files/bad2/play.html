<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#d9f7fa;background:#04131a;font-synthesis:none}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button,input{font:inherit}button{color:inherit}.app{position:relative;width:100%;height:100%;min-height:620px;background:radial-gradient(circle at 50% 35%,#0b2730 0%,#04131a 66%)}#game{display:block;width:100%;height:100%;outline:none}.glass{background:linear-gradient(135deg,rgba(5,22,29,.93),rgba(8,31,39,.77));border:1px solid rgba(139,232,237,.18);box-shadow:0 18px 60px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.035);backdrop-filter:blur(18px)}#hud{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:min(720px,calc(100% - 420px));min-width:470px;padding:14px 18px 12px;border-radius:16px;pointer-events:none}.brand{display:flex;align-items:center;justify-content:space-between;gap:18px}.eyebrow{margin:0 0 3px;font-size:10px;letter-spacing:.22em;color:#6ccbd1;text-transform:uppercase}h1{margin:0;font-size:24px;line-height:1;font-weight:700;letter-spacing:.06em}.turn{border:1px solid rgba(126,212,219,.25);border-radius:999px;padding:7px 12px;color:#91c9ce;background:rgba(2,14,19,.48);font-size:12px;white-space:nowrap}.turn.active{color:#6df6d6;border-color:rgba(109,246,214,.42);box-shadow:0 0 24px rgba(53,237,198,.12)}.status{margin-top:11px;min-height:22px;color:#e7fbfc;font-size:13px;line-height:1.45}.fleetbars{margin-top:8px;display:flex;gap:18px;color:#88afb5;font-size:11px}.fleetbars b{color:#d9f7fa}.api-line{margin-top:7px;padding-top:7px;border-top:1px solid rgba(160,220,224,.08);color:#5eb7c1;font-size:10px}#placementPanel{position:absolute;right:18px;top:18px;width:360px;padding:16px;border-radius:16px;max-height:calc(100% - 84px);overflow:auto}.heading{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;letter-spacing:.04em}.orientation{color:#62d3d5;border:1px solid rgba(98,211,213,.22);background:rgba(98,211,213,.06);border-radius:7px;padding:3px 7px;font-size:10px}.hint{margin:9px 0 12px;font-size:11px;line-height:1.6;color:#7ca3aa}.ship-list{display:grid;gap:7px}.ship-item{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:1px solid rgba(143,202,208,.12);background:rgba(8,29,36,.78);border-radius:10px;padding:9px 10px;cursor:grab;transition:.16s ease}.ship-item:hover{transform:translateX(-2px);border-color:rgba(100,221,215,.32)}.ship-item.selected{border-color:rgba(92,238,213,.55);background:rgba(17,64,67,.65);box-shadow:inset 3px 0 #5ceed5}.ship-item.placed{opacity:.72}.ship-item span:first-child{display:flex;flex-direction:column;gap:2px}.ship-item small{color:#517880;font-size:8px;letter-spacing:.14em}.length{color:#64d8d4;font-size:10px;letter-spacing:2px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions .primary{grid-column:1/-1}.primary,.secondary{border:1px solid transparent;border-radius:9px;padding:9px 11px;cursor:pointer;transition:.16s ease}.primary{background:linear-gradient(135deg,#46d8c5,#2a9fb0);color:#042025;font-weight:800;box-shadow:0 8px 26px rgba(40,198,190,.16)}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.primary:disabled{opacity:.3;cursor:not-allowed;transform:none}.secondary{border-color:rgba(126,202,208,.18);background:rgba(5,24,31,.65);color:#aad4d7}.secondary:hover{border-color:rgba(113,224,217,.4);color:#e6ffff}.wide{width:100%;margin-top:8px}.warning{margin-top:9px;padding:7px 9px;border-radius:7px;color:#ff9baa;background:rgba(147,30,52,.18);font-size:10px}.api-input{width:100%;border:1px solid rgba(121,198,205,.16);background:rgba(0,10,14,.62);color:#dff9fa;border-radius:9px;padding:9px 10px;outline:none;font-size:11px}.api-input:focus{border-color:rgba(88,224,215,.5)}.intel{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px}.intel span{border:1px solid rgba(126,196,202,.09);border-radius:8px;padding:7px;color:#6f9da3;font-size:9px}.intel b{float:right;color:#c7edef}.board-label{position:absolute;bottom:24px;font-size:9px;letter-spacing:.18em;color:#7db8bd;background:rgba(3,19,25,.68);border:1px solid rgba(114,196,202,.12);border-radius:999px;padding:7px 11px;pointer-events:none}.player-label{left:23%;transform:translateX(-50%)}.enemy-label{left:69%;transform:translateX(-50%);color:#8ebee4}.restart{position:absolute;left:18px;top:18px;z-index:3;border:1px solid rgba(130,201,207,.16);background:rgba(4,22,29,.72);color:#86b9be;border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(12px)}.restart:hover{color:#dffbfb;border-color:rgba(101,222,214,.38)}.modal,.startup{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(1,10,14,.68);backdrop-filter:blur(12px)}.modal.show,.startup.show{display:flex}.card{width:min(430px,calc(100% - 40px));border:1px solid rgba(120,220,219,.2);border-radius:18px;padding:24px;background:linear-gradient(145deg,#082129,#06171d);box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}.card h2{margin:4px 0 10px;font-size:30px}.card>p:not(.eyebrow):not(.hint){color:#9bc2c6;font-size:13px;line-height:1.6}.result{display:flex;justify-content:center;gap:24px;margin:15px 0;color:#75afb4;font-size:11px}.card .primary{min-width:160px}.api-box{margin-top:13px;padding-top:12px;border-top:1px solid rgba(126,196,202,.1)}
@media(max-width:980px){#hud{left:14px;top:14px;transform:none;width:calc(100% - 28px);min-width:0;padding-right:300px}#placementPanel{width:280px;top:112px;right:14px;max-height:calc(100% - 170px)}.board-label{bottom:16px}}@media(max-width:720px){.app{min-height:560px}#hud{padding:12px;top:8px;left:8px;width:calc(100% - 16px)}h1{font-size:18px}.fleetbars{gap:10px;flex-wrap:wrap}#placementPanel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:42%}.ship-list{grid-template-columns:1fr 1fr}.ship-item{padding:7px}.length{display:none}.board-label{display:none}.restart{top:104px;left:8px}}

<body>
<div id="root">
<div class="app">
  <canvas id="game" aria-label="3D 战舰战场"></canvas>
  <div id="hud" class="glass">
    <div class="brand"><div><p class="eyebrow" data-testid="phase">BLACKTIDE CIC // 部署</p><h1>黑潮作战情报中心</h1></div><div id="turn" class="turn" data-testid="turn-indicator">部署阶段</div></div>
    <div id="status" class="status" data-testid="status-message">正在初始化 3D 海域…</div>
    <div class="fleetbars"><span>己方舰艇 <b id="playerRemain">5/5</b></span><span>敌方舰艇 <b id="enemyRemain">5/5</b></span><span>攻击 <b id="attackCount">0:0</b></span></div>
    <div id="apiStatus" class="api-line" data-testid="api-status">AI：本地公平策略（未配置 OpenRouter 密钥）</div>
  </div>
  <div class="board-label player-label" data-testid="player-board-label">己方海域 // PLAYER GRID</div>
  <div class="board-label enemy-label" data-testid="enemy-board-label">敌方海域 // TARGET GRID</div>
  <aside id="placementPanel" class="glass"></aside>
  <button class="restart" data-testid="restart-btn" id="restartBtn">重新开始</button>
  <div id="gameOverModal" class="modal" aria-hidden="true"><div class="card"><p class="eyebrow">ENGAGEMENT COMPLETE</p><h2 id="gameOverTitle">任务结束</h2><p id="gameOverText"></p><div class="result"><span id="humanAttacks"></span><span id="aiAttacks"></span></div><button class="primary" id="againBtn">再次出航</button></div></div>
  <div id="startupError" class="startup"><div class="card"><p class="eyebrow">BOOT FAILURE</p><h2>3D 引擎启动失败</h2><p id="startupErrorText"></p><p class="hint">请确认浏览器支持 WebGL，并允许加载 Three.js CDN。</p><button class="primary" id="reloadBtn">重新加载</button></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
'use strict';
const OPENROUTER_API_KEY='your-openrouter-api-key-here';
const FLEET_SPEC=[
{id:'carrier',type:'carrier',name:'航母',length:5},{id:'battleship',type:'battleship',name:'战列舰',length:4},{id:'cruiser',type:'cruiser',name:'巡洋舰',length:3},{id:'submarine',type:'submarine',name:'潜艇',length:3},{id:'destroyer',type:'destroyer',name:'驱逐舰',length:2}
];
const coordOf=(r,c)=>String.fromCharCode(65+r)+(c+1);
function parseCoord(v){const m=String(v||'').trim().toUpperCase().match(/\b([A-J])\s*(10|[1-9])\b/);return m?{row:m[1].charCodeAt(0)-65,col:Number(m[2])-1}:null}
const delay=ms=>new Promise(r=>setTimeout(r,ms));
function safeGet(k){try{return localStorage.getItem(k)||''}catch{return''}}function safeSet(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}function safeRemove(k){try{localStorage.removeItem(k);return true}catch{return false}}
class Ship{constructor(spec,owner){Object.assign(this,spec);this.orientation=null;this.start=null;this.cells=[];this.hits=[];this.sunk=false;this.confirmed=false;this.revealed=owner==='player';this.meshVisible=false;this.meshObjectId=null}}
class GameBoard{
 constructor(owner,origin){this.owner=owner;this.size=10;this.origin=origin;this.cellSize=1;this.ships=FLEET_SPEC.map(s=>new Ship(s,owner));this.cells=Array.from({length:100},(_,i)=>({row:Math.floor(i/10),col:i%10,shipId:null,attacked:false,result:null,markerObjectId:null}));this.attackHistory=[]}
 cell(r,c){return this.cells[r*10+c]} ship(id){return this.ships.find(s=>s.id===id)}
 canPlace(id,row,col,orientation){const ship=this.ship(id),cells=[];if(!ship)return{ok:false,reason:'舰船不存在',cells:[]};for(let i=0;i<ship.length;i++){const r=row+(orientation==='vertical'?i:0),c=col+(orientation==='horizontal'?i:0);if(r<0||r>=10||c<0||c>=10)return{ok:false,reason:'舰船超出棋盘边界',cells:[]};const target=this.cell(r,c);if(target.shipId&&target.shipId!==id)return{ok:false,reason:'该区域与其他舰船重叠',cells:[]};cells.push({row:r,col:c})}return{ok:true,reason:null,cells}}
 placeShip(id,row,col,orientation){const res=this.canPlace(id,row,col,orientation);if(!res.ok)return res;const ship=this.ship(id);for(const p of ship.cells){const old=this.cell(p.row,p.col);if(old.shipId===id)old.shipId=null}ship.start={row,col};ship.orientation=orientation;ship.cells=res.cells;ship.confirmed=true;ship.revealed=this.owner==='player';res.cells.forEach(p=>this.cell(p.row,p.col).shipId=id);return res}
 resetPlacements(){for(const c of this.cells)Object.assign(c,{shipId:null,attacked:false,result:null,markerObjectId:null});for(const s of this.ships)Object.assign(s,{orientation:null,start:null,cells:[],hits:[],sunk:false,confirmed:false,revealed:this.owner==='player',meshVisible:false,meshObjectId:null});this.attackHistory=[]}
 randomize(){this.resetPlacements();for(const s of FLEET_SPEC){let ok=false;for(let n=0;n<1000&&!ok;n++){const o=Math.random()>.5?'horizontal':'vertical',r=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);ok=this.placeShip(s.id,r,c,o).ok}if(!ok)throw new Error('随机布阵失败')}}
 attack(row,col){const cell=this.cell(row,col);if(cell.attacked)return{valid:false,result:cell.result,shipId:cell.shipId,sunkShip:null};cell.attacked=true;let result='miss',sunkShip=null;if(cell.shipId){const ship=this.ship(cell.shipId);ship.hits.push({row,col});result='hit';if(ship.hits.length>=ship.length){ship.sunk=true;ship.revealed=true;result='sunk';sunkShip=ship}}cell.result=result;this.attackHistory.push({row,col,coordinate:coordOf(row,col),result,shipId:cell.shipId});return{valid:true,result,shipId:cell.shipId,sunkShip}}
 allSunk(){return this.ships.every(s=>s.sunk)}
 getState(){const fog=this.owner==='enemy';return{owner:this.owner,size:this.size,origin:{...this.origin},cellSize:this.cellSize,ships:this.ships.map(s=>{const pub=!fog||s.sunk;return{id:s.id,type:s.type,name:s.name,length:s.length,orientation:pub?s.orientation:null,start:pub&&s.start?{...s.start}:null,cells:pub?s.cells.map(x=>({...x})):[],hits:pub?s.hits.map(x=>({...x})):[],sunk:s.sunk,confirmed:pub?s.confirmed:false,revealed:fog&&!s.sunk?true:pub,meshVisible:pub?s.meshVisible:false,meshObjectId:pub?s.meshObjectId:null}}),cells:this.cells.map(c=>{const ship=c.shipId?this.ship(c.shipId):null;return{row:c.row,col:c.col,shipId:(!fog||ship&&ship.sunk)?c.shipId:null,attacked:c.attacked,result:c.attacked?c.result:null,markerObjectId:c.markerObjectId}}),attackHistory:this.attackHistory.map(a=>{const ship=a.shipId?this.ship(a.shipId):null;return{...a,shipId:(!fog||ship&&ship.sunk)?a.shipId:null}}),shipsRemaining:this.ships.filter(s=>!s.sunk).length,totalHits:this.ships.reduce((n,s)=>n+s.hits.length,0),occupiedCellCount:this.cells.filter(c=>c.shipId).length}}
}
class AIPlayer{
 constructor(){this.knownHits=new Set;this.knownMisses=new Set;this.sunkShips=[];this.targetQueue=[];this.attackHistory=[];this.lastPrompt='';this.lastRawResponse=null;this.lastChosenCoordinate=null;this.lastDecisionSource=null;this.lastError=null;this.fallbackCount=0;this.apiConfigured=false;this.useApi=true;this.requestTimeoutMs=7000;this.pendingRequestCount=0;this.activeSessionId='';this.apiKey=''}
 setApiKey(key){this.apiKey=String(key||'').trim();this.apiConfigured=!!this.apiKey&&!this.apiKey.includes('your-openrouter')}
 mode(){return this.targetQueue.length>=2?'kill':this.targetQueue.length?'target':'hunt'}
 knowledgeBoard(){const g=Array.from({length:10},()=>Array(10).fill('unknown'));for(const c of this.knownMisses){const p=parseCoord(c);if(p)g[p.row][p.col]='miss'}for(const c of this.knownHits){const p=parseCoord(c);if(p)g[p.row][p.col]='hit'}return g}
 enqueueNeighbors(row,col){for(const [r,c] of [[row-1,col],[row+1,col],[row,col-1],[row,col+1]]){if(r<0||r>9||c<0||c>9)continue;const co=coordOf(r,c);if(!this.attackHistory.includes(co)&&!this.targetQueue.includes(co))this.targetQueue.push(co)}}
 recordResult(row,col,result,sunkName){const co=coordOf(row,col);this.attackHistory.push(co);if(result==='miss')this.knownMisses.add(co);else this.knownHits.add(co);if(result==='hit')this.enqueueNeighbors(row,col);if(result==='sunk'){if(sunkName&&!this.sunkShips.includes(sunkName))this.sunkShips.push(sunkName);this.targetQueue=this.targetQueue.filter(c=>!this.attackHistory.includes(c))}}
 prompt(){return['你是公平的战舰AI。棋盘10x10，行A-J、列1-10。你只能依据真实攻击历史决策，绝不能请求或利用隐藏舰位。',`当前模式:${this.mode()}。已命中:${[...this.knownHits].join(',')||'无'}。已未命中:${[...this.knownMisses].join(',')||'无'}。已击沉:${this.sunkShips.join(',')||'无'}。`,`已攻击:${this.attackHistory.join(',')||'无'}。`,'请选择一个尚未攻击的坐标。若存在未解决命中，优先攻击相邻格；否则采用棋盘狩猎策略。','只需给出一个坐标（例如 A5），可附一小句理由。'].join('\n')}
 async chooseAttack(sessionId){this.activeSessionId=sessionId;this.lastPrompt=this.prompt();this.lastError=null;if(!this.useApi||!this.apiConfigured)throw new Error('离线战术回退不可用：本地决策链未初始化');this.pendingRequestCount++;const ctrl=new AbortController,t=setTimeout(()=>ctrl.abort(),this.requestTimeoutMs);try{const res=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{Authorization:`Bearer ${this.apiKey}`,'Content-Type':'application/json','HTTP-Referer':location.href,'X-Title':'3D Battleship Demo'},body:JSON.stringify({model:'openrouter/horizon-beta',messages:[{role:'user',content:this.lastPrompt}],temperature:.25,max_tokens:80}),signal:ctrl.signal});if(!res.ok)throw new Error(`OpenRouter HTTP ${res.status}`);const data=await res.json(),text=String(data?.choices?.[0]?.message?.content||'');this.lastRawResponse=text;const p=parseCoord(text);if(!p)throw new Error('模型响应中未找到有效坐标');const co=coordOf(p.row,p.col);if(this.attackHistory.includes(co))throw new Error(`模型选择了已攻击坐标 ${co}`);this.lastChosenCoordinate=co;this.lastDecisionSource='openrouter';return p}catch(e){this.lastError=e instanceof Error?e.message:String(e);console.warn('[AI] OpenRouter failed, falling back:',e);return this.fallback('local-fallback:api-error')}finally{clearTimeout(t);this.pendingRequestCount=Math.max(0,this.pendingRequestCount-1)}}
 fallback(source){this.fallbackCount++;this.targetQueue=this.targetQueue.filter(c=>!this.attackHistory.includes(c));let co=this.targetQueue.shift()||'';if(!co){let a=[];for(let r=0;r<10;r++)for(let c=0;c<10;c++){const q=coordOf(r,c);if(!this.attackHistory.includes(q)&&(r+c)%2===0)a.push(q)}if(!a.length)for(let r=0;r<10;r++)for(let c=0;c<10;c++){const q=coordOf(r,c);if(!this.attackHistory.includes(q))a.push(q)}co=a[Math.floor(Math.random()*a.length)]}const p=parseCoord(co);this.lastChosenCoordinate=co;this.lastDecisionSource=source;return p}
 getState(){return{mode:this.mode(),knownHits:[...this.knownHits],knownMisses:[...this.knownMisses],sunkShips:[...this.sunkShips],targetQueue:[...this.targetQueue],attackHistory:[...this.attackHistory],knowledgeBoard:this.knowledgeBoard(),lastPrompt:this.lastPrompt,lastRawResponse:this.lastRawResponse,lastChosenCoordinate:this.lastChosenCoordinate,lastDecisionSource:this.lastDecisionSource,lastError:this.lastError,fallbackCount:this.fallbackCount,apiConfigured:this.apiConfigured,requestTimeoutMs:this.requestTimeoutMs,pendingRequestCount:this.pendingRequestCount,activeSessionId:this.activeSessionId}}
}
class Battlefield{

 testAIAttack(row,col){const g=this.state;if(g.phase!=='playing'||g.turn!=='ai')return{ok:false,reason:'wrong_turn'};if(row<0||row>9||col<0||col>9)return{ok:false,reason:'out_of_bounds'};const a=this.playerBoard.attack(row,col);if(!a.valid)return{ok:false,reason:'already_attacked'};g.aiAttackCount++;this.ai.recordResult(row,col,a.result,a.sunkShip?.name);g.lastAction={actor:'ai',row,col,coordinate:coordOf(row,col),result:a.result,shipId:a.shipId};this.field?.markAttack(this.playerBoard,row,col,a.result,a.shipId);if(a.sunkShip)this.field?.syncShips(this.playerBoard);this.audio.lastCue=a.result;const message=attackText('AI',coordOf(row,col),a.result,a.sunkShip?.name);this.battleLog.push({actor:'ai',coordinate:coordOf(row,col),result:a.result,message});g.statusMessage=message;if(this.playerBoard.allSunk())this.end('ai');else{g.turn='human';g.inputLocked=false;this.updateHUD()}return{ok:true,row,col,coordinate:coordOf(row,col),result:a.result,shipId:a.shipId}}
 testConfigureAI(cfg={}){if(typeof cfg.timeoutMs==='number')this.ai.requestTimeoutMs=cfg.timeoutMs;if(typeof cfg.useApi==='boolean')this.ai.useApi=cfg.useApi;if(typeof cfg.enabled==='boolean')this.ai.useApi=cfg.enabled;if(typeof cfg.apiKey==='string')this.ai.setApiKey(cfg.apiKey);return this.ai.getState()}
 async testRequestAIMove(){const p=await this.ai.chooseAttack(this.state.sessionId);return p?{ok:true,row:p.row,col:p.col,coordinate:coordOf(p.row,p.col)}:{ok:false,reason:'no_move'}}
 async testWait(ms=1200){const end=Date.now()+ms;while(Date.now()<end){if(this.ai.pendingRequestCount===0)return true;await delay(20)}return false}
 updateHUD(){document.getElementById('status').textContent=this.state.statusMessage;document.getElementById('turn').textContent=this.state.phase==='setup'?'部署阶段':this.state.phase==='ended'?'战斗结束':this.state.turn==='human'?'你的回合':'AI 思考中';document.getElementById('turn').classList.toggle('active',this.state.turn==='human');document.getElementById('playerRemain').textContent=this.playerBoard.ships.filter(s=>!s.sunk).length+'/5';document.getElementById('enemyRemain').textContent=this.enemyBoard.ships.filter(s=>!s.sunk).length+'/5';document.getElementById('attackCount').textContent=this.state.humanAttackCount+':'+this.state.aiAttackCount;document.getElementById('apiStatus').textContent=this.state.apiStatus}
 renderPanel(){const el=document.getElementById('placementPanel');if(this.state.phase==='setup'){el.innerHTML=`<div class="heading"><span>舰队部署</span><span class="orientation" data-testid="orientation-indicator">${this.placement.orientation==='horizontal'?'水平 H':'垂直 V'}</span></div><p class="hint">选择舰船后点击左侧己方海域。也可拖动舰船条目到网格。按 R 旋转。</p><div class="ship-list" data-testid="ship-list">${FLEET_SPEC.map(s=>{const ship=this.playerBoard.ship(s.id);return`<button class="ship-item ${this.placement.selectedShipId===s.id?'selected':''} ${ship.confirmed?'placed':''}" data-id="${s.id}" data-ship-id="${s.id}" data-testid="ship-item" draggable="true"><span><b>${s.name}</b><small>${s.type.toUpperCase()}</small></span><span class="length">${'▰'.repeat(s.length)}</span></button>`}).join('')}</div><div class="actions"><button class="secondary" data-testid="rotate-btn" id="rotateBtn">旋转 R</button><button class="secondary" data-testid="randomize-placement" id="randomBtn">随机部署</button><button class="primary" data-testid="confirm-placement" id="confirmBtn" ${this.playerBoard.ships.every(s=>s.confirmed)?'':'disabled'}>确认开战</button></div>${this.placement.invalidReason?`<div class="warning">${this.placement.invalidReason}</div>`:''}<div class="api-box"><p class="hint">OpenRouter 密钥可在开战前或开战后设置；默认占位符会自动启用本地公平 AI。</p><input class="api-input" id="apiKey" type="password" placeholder="OpenRouter API Key" value="${escapeHtml(safeGet('battleship-openrouter-key'))}"/><button class="secondary wide" id="saveApi">保存 API 密钥</button></div>`;for(const b of el.querySelectorAll('.ship-item')){b.onclick=()=>this.select(b.dataset.id);b.ondragstart=()=>{this.placement.draggingShipId=b.dataset.id;this.placement.selectedShipId=b.dataset.id};b.ondragend=()=>{this.placement.draggingShipId=null}}document.getElementById('rotateBtn').onclick=()=>this.rotate();document.getElementById('randomBtn').onclick=()=>this.randomize();document.getElementById('confirmBtn').onclick=()=>this.confirm();document.getElementById('saveApi').onclick=()=>this.saveApi()}else{el.innerHTML=`<div class="heading"><span>AI 智能体</span><span class="orientation">HORIZON</span></div><p class="hint">模型：openrouter/horizon-beta。密钥仅保存在本机浏览器 localStorage；API 失败会自动回退到公平的本地狩猎/追击策略。</p><input class="api-input" id="apiKey" type="password" placeholder="OpenRouter API Key" value="${escapeHtml(safeGet('battleship-openrouter-key'))}"/><button class="secondary wide" id="saveApi">保存 API 密钥</button><div class="intel"><span>模式 <b>${this.ai.mode().toUpperCase()}</b></span><span>回退 <b>${this.ai.fallbackCount}</b></span><span>已知命中 <b>${this.ai.knownHits.size}</b></span><span>已知未中 <b>${this.ai.knownMisses.size}</b></span></div>`;document.getElementById('saveApi').onclick=()=>this.saveApi()}}
 saveApi(){const v=document.getElementById('apiKey').value.trim();if(v)safeSet('battleship-openrouter-key',v);else safeRemove('battleship-openrouter-key');this.ai.setApiKey(v||OPENROUTER_API_KEY);this.state.apiStatus=this.ai.apiConfigured?'AI：OpenRouter 已配置':'AI：本地公平策略（未配置 OpenRouter 密钥）';this.updateHUD();this.renderPanel()}
 select(id){this.placement.selectedShipId=id;this.state.statusMessage='已选择 '+this.playerBoard.ship(id).name+'，点击己方海域放置。';this.renderPanel();this.updateHUD()}
 rotate(){this.placement.orientation=this.placement.orientation==='horizontal'?'vertical':'horizontal';this.placement.previewCells=[];this.field?.clearPreview('player');this.state.statusMessage='方向已切换为'+(this.placement.orientation==='horizontal'?'水平':'垂直')+'。';this.renderPanel();this.updateHUD()}
 preview(row,col){const id=this.placement.draggingShipId||this.placement.selectedShipId;if(!id)return;const r=this.playerBoard.canPlace(id,row,col,this.placement.orientation);this.placement.previewCells=r.ok?r.cells:this.potential(id,row,col);this.placement.previewValid=r.ok;this.placement.invalidReason=r.reason;this.field.setPreview('player',this.placement.previewCells,r.ok)}
 potential(id,row,col){const s=this.playerBoard.ship(id),a=[];for(let i=0;i<s.length;i++){const r=row+(this.placement.orientation==='vertical'?i:0),c=col+(this.placement.orientation==='horizontal'?i:0);if(r>=0&&r<10&&c>=0&&c<10)a.push({row:r,col:c})}return a}
 place(row,col){const id=this.placement.draggingShipId||this.placement.selectedShipId;if(!id)return;const r=this.playerBoard.placeShip(id,row,col,this.placement.orientation);this.placement.lastPlacementResult={shipId:id,row,col,orientation:this.placement.orientation,ok:r.ok,reason:r.reason};this.placement.previewCells=r.ok?r.cells:[];this.placement.previewValid=r.ok;this.placement.invalidReason=r.reason;this.field.clearShips('player');this.field.syncShips(this.playerBoard);if(r.ok){const next=this.playerBoard.ships.find(s=>!s.confirmed);this.placement.selectedShipId=next?.id||id;this.state.statusMessage=next?this.playerBoard.ship(id).name+' 已部署。继续放置 '+next.name+'。':'舰队部署完成，可确认开战。';playTone(420,.06)}else{this.state.statusMessage=r.reason||'无效放置';playTone(150,.08)}this.renderPanel();this.updateHUD()}
 randomize(){this.playerBoard.randomize();this.field.clearShips('player');this.field.syncShips(this.playerBoard);this.placement.selectedShipId=FLEET_SPEC[0].id;this.placement.previewCells=[];this.placement.previewValid=false;this.placement.invalidReason=null;this.placement.lastPlacementResult={randomize:true,ok:true};this.state.statusMessage='已随机部署全部舰船，可继续微调或确认开战。';this.renderPanel();this.updateHUD()}
 confirm(){if(!this.playerBoard.ships.every(s=>s.confirmed)){this.state.statusMessage='请先部署全部 5 艘舰船。';this.updateHUD();return}this.field.clearPreview('player');this.state.phase='playing';this.state.turn='human';this.state.inputLocked=false;this.state.statusMessage='战斗开始。点击敌方海域选择攻击坐标。';this.field.syncShips(this.playerBoard);this.renderPanel();this.updateHUD()}
 async humanAttack(row,col){const g=this.state;if(g.phase!=='playing'||g.turn!=='human'||g.inputLocked)return;if(this.enemyBoard.cell(row,col).attacked){g.statusMessage=coordOf(row,col)+' 已攻击过，请选择其他坐标。';playTone(120,.08);this.updateHUD();return}g.inputLocked=true;const a=this.enemyBoard.attack(row,col);if(!a.valid||!a.result){g.inputLocked=false;return}g.humanAttackCount++;g.lastAction={actor:'human',row,col,coordinate:coordOf(row,col),result:a.result,shipId:a.sunkShip?a.shipId:null};this.field.markAttack(this.enemyBoard,row,col,a.result,a.shipId);if(a.sunkShip)this.field.syncShips(this.enemyBoard);g.statusMessage=attackText('你',coordOf(row,col),a.result,a.sunkShip?.name);playAttackSound(a.result);if(this.enemyBoard.allSunk()){this.end('human');return}g.turn='ai';g.apiStatus=this.ai.apiConfigured?'AI：正在请求 OpenRouter 决策…':'AI：使用本地公平狩猎策略';this.renderPanel();this.updateHUD();await delay(520);await this.aiTurn(g.sessionId)}
 async aiTurn(sessionId){const g=this.state;if(g.phase!=='playing'||sessionId!==g.sessionId)return;const move=await this.ai.chooseAttack(sessionId);if(g.phase!=='playing'||sessionId!==g.sessionId)return;g.apiStatus=this.ai.lastDecisionSource==='openrouter'?'AI：OpenRouter 决策完成':'AI：'+(this.ai.lastDecisionSource||'本地回退');const a=this.playerBoard.attack(move.row,move.col);if(!a.valid||!a.result){this.ai.lastError='AI duplicate coordinate after validation';return this.aiTurn(sessionId)}g.aiAttackCount++;this.ai.recordResult(move.row,move.col,a.result,a.sunkShip?.name);g.lastAction={actor:'ai',row:move.row,col:move.col,coordinate:coordOf(move.row,move.col),result:a.result,shipId:a.shipId};this.field.markAttack(this.playerBoard,move.row,move.col,a.result,a.shipId);g.statusMessage=attackText('AI',coordOf(move.row,move.col),a.result,a.sunkShip?.name);playAttackSound(a.result);if(this.playerBoard.allSunk()){this.end('ai');return}await delay(340);g.turn='human';g.inputLocked=false;g.statusMessage+=' 你的回合。';this.renderPanel();this.updateHUD()}
 end(winner){this.state.phase='ended';this.state.turn=null;this.state.inputLocked=true;this.state.winner=winner;this.state.statusMessage=winner==='human'?'你赢了！敌方舰队已全部击沉。':'AI 赢了！你的舰队已全部沉没。';this.state.apiStatus='战斗已结束';this.field.celebrate();document.getElementById('gameOverTitle').textContent=winner==='human'?'任务成功':'舰队失联';document.getElementById('gameOverText').textContent=this.state.statusMessage;document.getElementById('humanAttacks').textContent='你的攻击 '+this.state.humanAttackCount;document.getElementById('aiAttacks').textContent='AI 攻击 '+this.state.aiAttackCount;document.getElementById('gameOverModal').classList.add('show');document.getElementById('gameOverModal').setAttribute('aria-hidden','false');this.updateHUD()}
}
function attackText(actor,co,result,sunk){if(result==='miss')return actor+'攻击 '+co+'：未命中。';if(result==='sunk')return actor+'攻击 '+co+'：击沉'+(sunk?' '+sunk:'舰船')+'！';return actor+'攻击 '+co+'：命中！'}
function playTone(freq,dur){try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C,osc=ctx.createOscillator(),gain=ctx.createGain();osc.frequency.value=freq;gain.gain.value=.035;osc.connect(gain);gain.connect(ctx.destination);osc.start();gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);osc.stop(ctx.currentTime+dur)}catch{}}
function playAttackSound(r){if(r==='miss')playTone(230,.11);else if(r==='sunk'){playTone(95,.25);setTimeout(()=>playTone(62,.3),120)}else playTone(115,.16)}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
const game=new BattleshipGame();
document.getElementById('restartBtn').onclick=()=>location.reload();document.getElementById('againBtn').onclick=()=>location.reload();document.getElementById('reloadBtn').onclick=()=>location.reload();
game.init();
</script>
